<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">HealthBot final runtime architecture</title>
  <desc id="desc">A structured clinical NLP assistant architecture showing the canonical deterministic evidence pipeline, structured DDXPlus classifier, independent safety path, and optional components.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#176b5b"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .title { font-size: 25px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #475569; }
      .box-title { font-size: 15px; font-weight: 700; fill: #172033; }
      .box-text { font-size: 12px; fill: #475569; }
      .mono { font-family: "Courier New", monospace; font-size: 11px; fill: #64748b; }
      .small { font-size: 11px; fill: #64748b; }
      .flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-green { stroke: #176b5b; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .flow-red { stroke: #b45309; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .flow-dashed { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .runtime { fill: #f0f8f6; stroke: #176b5b; stroke-width: 1.5; }
      .support { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .model { fill: #e2f1ed; stroke: #176b5b; stroke-width: 1.7; }
      .safety { fill: #fff7ed; stroke: #b45309; stroke-width: 1.6; }
      .optional { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .training { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#ffffff"/>
  <rect x="0" y="0" width="1500" height="82" fill="#f0f8f6"/>
  <text x="55" y="38" class="title">HealthBot — final verified runtime architecture</text>
  <text x="55" y="62" class="subtitle">Structured clinical NLP assistant · deterministic DDXPlus evidence pipeline · safety escalation independent of pathology ranking</text>

  <text x="55" y="116" class="section">1  INTERFACE / API</text>
  <rect x="55" y="135" width="230" height="78" rx="10" class="runtime" filter="url(#shadow)"/>
  <text x="170" y="162" text-anchor="middle" class="box-title">User / Browser</text><text x="170" y="184" text-anchor="middle" class="mono">static HTML + vanilla JS</text><text x="170" y="200" text-anchor="middle" class="small">chat UI and API client</text>
  <rect x="355" y="135" width="260" height="78" rx="10" class="runtime" filter="url(#shadow)"/>
  <text x="485" y="162" text-anchor="middle" class="box-title">Flask web application</text><text x="485" y="184" text-anchor="middle" class="mono">server.py · api/routes.py</text><text x="485" y="200" text-anchor="middle" class="small">frontend + REST API layer</text>
  <rect x="685" y="135" width="260" height="78" rx="10" class="support" filter="url(#shadow)"/>
  <text x="815" y="162" text-anchor="middle" class="box-title">Stateful conversational flow</text><text x="815" y="184" text-anchor="middle" class="mono">SessionStore → ChatSession</text><text x="815" y="200" text-anchor="middle" class="small">in-memory slots and context</text>
  <rect x="1015" y="135" width="260" height="78" rx="10" class="support" filter="url(#shadow)"/>
  <text x="1145" y="162" text-anchor="middle" class="box-title">Stateless analysis / case APIs</text><text x="1145" y="184" text-anchor="middle" class="mono">/api/analyze · /api/case/predict</text><text x="1145" y="200" text-anchor="middle" class="small">single-request structured flow</text>
  <path d="M285 174 H355" class="flow-green"/><path d="M615 174 H685" class="flow"/><path d="M615 190 H1015" class="flow"/>
  <text x="650" y="165" class="small">chat session</text><text x="820" y="226" class="small">both paths converge on raw user text</text>

  <rect x="55" y="250" width="1220" height="305" rx="14" fill="#f8fbfa" stroke="#cbded9"/>
  <text x="80" y="280" class="section">2  NLP / EVIDENCE PIPELINE</text>
  <rect x="80" y="305" width="200" height="70" rx="9" class="support"/><text x="180" y="331" text-anchor="middle" class="box-title">Raw user text</text><text x="180" y="353" text-anchor="middle" class="small">chat message or API text</text>
  <rect x="315" y="305" width="200" height="70" rx="9" class="support"/><text x="415" y="331" text-anchor="middle" class="box-title">Language detection</text><text x="415" y="353" text-anchor="middle" class="mono">English · Hinglish · Marathi</text>
  <rect x="550" y="305" width="220" height="70" rx="9" class="support"/><text x="660" y="331" text-anchor="middle" class="box-title">Multilingual normalization</text><text x="660" y="353" text-anchor="middle" class="mono">canonical symptom concepts</text>
  <rect x="805" y="305" width="235" height="70" rx="9" class="support"/><text x="922" y="331" text-anchor="middle" class="box-title">Deterministic extraction</text><text x="922" y="353" text-anchor="middle" class="mono">aliases + source spans</text>
  <path d="M280 340 H315" class="flow"/><path d="M515 340 H550" class="flow"/><path d="M770 340 H805" class="flow"/>
  <rect x="170" y="410" width="235" height="70" rx="9" class="support"/><text x="287" y="436" text-anchor="middle" class="box-title">Negation handling</text><text x="287" y="458" text-anchor="middle" class="mono">positive vs denied evidence</text>
  <rect x="455" y="410" width="235" height="70" rx="9" class="support"/><text x="572" y="436" text-anchor="middle" class="box-title">Temporal handling</text><text x="572" y="458" text-anchor="middle" class="mono">current vs historical symptoms</text>
  <rect x="740" y="410" width="315" height="70" rx="9" class="support"/><text x="897" y="436" text-anchor="middle" class="box-title">Context / alias precedence</text><text x="897" y="458" text-anchor="middle" class="mono">family history · nested aliases</text>
  <path d="M922 375 V395 H287 V410" class="flow"/><path d="M922 375 V395 H572 V410" class="flow"/><path d="M922 375 V395 H897 V410" class="flow"/>
  <rect x="385" y="505" width="410" height="32" rx="8" fill="#e2f1ed" stroke="#176b5b"/><text x="590" y="526" text-anchor="middle" class="box-title" font-size="13">DDXPlus EVIDENCES: positive + denied</text>
  <path d="M287 480 V495 H590 V505" class="flow-green"/><path d="M572 480 V495 H590 V505" class="flow-green"/><path d="M897 480 V495 H590 V505" class="flow-green"/>

  <text x="55" y="600" class="section">3  CANONICAL STRUCTURED PREDICTION</text>
  <rect x="80" y="625" width="220" height="86" rx="10" class="model" filter="url(#shadow)"/><text x="190" y="651" text-anchor="middle" class="box-title">DDXPlus-compatible</text><text x="190" y="671" text-anchor="middle" class="box-title">INITIAL_EVIDENCE</text><text x="190" y="693" text-anchor="middle" class="mono">base evidence code</text>
  <rect x="335" y="625" width="260" height="86" rx="10" class="model" filter="url(#shadow)"/><text x="465" y="651" text-anchor="middle" class="box-title">Structured feature builder</text><text x="465" y="673" text-anchor="middle" class="mono">age + sex + initial + evidences</text><text x="465" y="693" text-anchor="middle" class="small">age/decade and value-code tokens</text>
  <rect x="630" y="625" width="170" height="86" rx="10" class="model" filter="url(#shadow)"/><text x="715" y="656" text-anchor="middle" class="box-title">TF-IDF</text><text x="715" y="678" text-anchor="middle" class="mono">saved vectorizer</text>
  <rect x="835" y="625" width="240" height="86" rx="10" class="model" filter="url(#shadow)"/><text x="955" y="651" text-anchor="middle" class="box-title">SGDClassifier</text><text x="955" y="673" text-anchor="middle" class="mono">loss="log_loss"</text><text x="955" y="693" text-anchor="middle" class="small">49 DDXPlus pathologies</text>
  <rect x="1110" y="625" width="165" height="86" rx="10" class="model" filter="url(#shadow)"/><text x="1192" y="656" text-anchor="middle" class="box-title">Ranked</text><text x="1192" y="676" text-anchor="middle" class="box-title">predictions</text><text x="1192" y="697" text-anchor="middle" class="small">scores + confidences</text>
  <path d="M590 537 V580 H190 V625" class="flow-green"/><text x="300" y="575" class="small">evidence codes</text><path d="M300 668 H335" class="flow-green"/><path d="M595 668 H630" class="flow-green"/><path d="M800 668 H835" class="flow-green"/><path d="M1075 668 H1110" class="flow-green"/>

  <text x="55" y="770" class="section">4  RESPONSE + INDEPENDENT SAFETY PATH</text>
  <rect x="1110" y="750" width="165" height="86" rx="10" class="support" filter="url(#shadow)"/><text x="1192" y="779" text-anchor="middle" class="box-title">Explanation layer</text><text x="1192" y="801" text-anchor="middle" class="mono">structured feature</text><text x="1192" y="818" text-anchor="middle" class="mono">contributions</text><path d="M1192 711 V750" class="flow-green"/>
  <rect x="1110" y="875" width="165" height="78" rx="10" class="runtime" filter="url(#shadow)"/><text x="1192" y="902" text-anchor="middle" class="box-title">User response</text><text x="1192" y="924" text-anchor="middle" class="mono">reply + predictions + meta</text><text x="1192" y="941" text-anchor="middle" class="small">back to browser / API</text><path d="M1192 836 V875" class="flow-green"/>
  <rect x="80" y="800" width="285" height="86" rx="10" class="safety" filter="url(#shadow)"/><text x="222" y="827" text-anchor="middle" class="box-title">Current / extracted symptoms</text><text x="222" y="850" text-anchor="middle" class="mono">red-flag keywords + severity slots</text><text x="222" y="869" text-anchor="middle" class="small">does not require top pathology</text>
  <rect x="420" y="800" width="245" height="86" rx="10" class="safety" filter="url(#shadow)"/><text x="542" y="827" text-anchor="middle" class="box-title">Red-flag + severity rules</text><text x="542" y="850" text-anchor="middle" class="mono">independent safety signal</text><text x="542" y="869" text-anchor="middle" class="small">negation-aware triage</text>
  <rect x="720" y="800" width="245" height="86" rx="10" class="safety" filter="url(#shadow)"/><text x="842" y="827" text-anchor="middle" class="box-title">Urgent guidance</text><text x="842" y="850" text-anchor="middle" class="mono">routine / urgent / emergency</text><text x="842" y="869" text-anchor="middle" class="small">response priority</text>
  <path d="M365 843 H420" class="flow-red"/><path d="M665 843 H720" class="flow-red"/><path d="M965 843 H1070 V914 H1110" class="flow-red"/><text x="1000" y="832" class="small" fill="#b45309">priority override / warning</text>

  <rect x="55" y="985" width="1220" height="100" rx="12" class="optional"/><text x="80" y="1013" class="section">OPTIONAL / NON-CANONICAL — disabled or absent by default</text><text x="80" y="1043" class="box-text">BioBERT semantic fallback (disabled)  ·  Ollama NLU / response formatter (disabled)  ·  Similar-case search (optional; tfidf_matrix.pkl + search_cases.pkl)</text><text x="80" y="1067" class="box-text">Simplified classifier (offline / research comparison only)  ·  These components do not replace the structured production path.</text>
  <path d="M815 213 V240 H1310 V1035 H1275" class="flow-dashed"/><text x="1290" y="270" class="small" transform="rotate(90 1290 270)">optional integrations</text>

  <rect x="1300" y="305" width="155" height="240" rx="12" class="training"/><text x="1377" y="333" text-anchor="middle" class="box-title">Offline training</text><text x="1377" y="357" text-anchor="middle" class="mono">DDXPlus CSVs</text><text x="1377" y="376" text-anchor="middle" class="mono">train.py</text><path d="M1377 389 V420" class="flow-dashed"/><text x="1377" y="448" text-anchor="middle" class="mono">core .pkl artifacts</text><text x="1377" y="467" text-anchor="middle" class="small">LFS tracked</text><path d="M1300 485 H1245 V625" class="flow-dashed"/><text x="1280" y="520" text-anchor="middle" class="small">load at startup</text><text x="1377" y="505" text-anchor="middle" class="small">CSV files are not</text><text x="1377" y="522" text-anchor="middle" class="small">needed for inference</text>
  <text x="55" y="1107" class="small">Canonical path: raw text → deterministic evidence → structured DDXPlus features → TF-IDF → SGDClassifier → ranked pathology candidates → explanation / response.</text>
</svg>
