<foreignObject x="40" y="628" width="1020" height="60"><text xmlns="http://www.w3.org/1999/xhtml" style="font-family:IBM Plex Sans, sans-serif; font-size:11px; color:#4b5566; line-height:1.5;">One user message -&gt; Flask resolves the session -&gt; ChatSession runs language detection, multilingual normalization, negation-aware red-flag checks, and the evidence bridge -&gt; the structured TF-IDF + linear classifier scores 49 pathologies -&gt; severity triage and response formatting -&gt; JSON (reply + predictions + explanation) streams back to the chat UI. *optional, off by default.</text></foreignObject>
